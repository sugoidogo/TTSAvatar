<!DOCTYPE html>

<body>
    <button onclick="copyURL()">copy overlay url</button>
</body>
<script type="module">
    import get_tokens from "https://tba.sugoidogo.com/tba.mjs"
    const client_id = "1gsnqnvtrguxysilfqp5gkb1snswmf"
    const scope = "channel:manage:redemptions channel:read:redemptions"
    const tokens = await get_tokens(client_id, scope)
    console.debug(tokens)

    function copyURL(redirect=false){
        const url = new URL('overlay.html', location.origin + location.pathname);
        url.search=new URLSearchParams({
            client_id:client_id
            , refresh_token: tokens.refresh_token
        })
        if(redirect){
            localStorage.removeItem('search')
            window.location.href=url.href
        }else{
            navigator.clipboard.writeText(url.toString())
        }
    }

    globalThis.copyURL = copyURL
</script>
